# build.yml kanged from Rezoss Reza modified to build kernel with ReSukiSU using the main branch
name: Build kernel (ReSukiSU, `main` branch)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
       contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up the toolchain
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison build-essential wget flex gh \
            g++-multilib gcc-multilib git gnupg \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            lzop zlib1g-dev pahole dwarves cpio zip \
            python3 python-is-python3 tar perl lz4 jq

      - name: Download anykernel.zip
        run: |
          wget -q https://github.com/gyabii/kernel_samsung_sm8550-common/releases/download/anykernel/anykernel.zip

      - name: Apply ReSukiSU
        run: |
          set -euxo pipefail
          echo "KERNEL_VERSION=$(grep -m1 '^SUBLEVEL =' ./Makefile | awk '{print $3}')" >> $GITHUB_ENV
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
          CONFIG_FILE=arch/arm64/configs/gki_defconfig
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          EOF

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Build the kernel
        run: |
          git config --global user.email "gyabii@proton.me"
          git config --global user.name "gyabii"
          chmod +x scripts/build.sh
          ./scripts/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "ERROR: Kernel compilation failed! out/arch/arm64/boot/Image.gz not found."
            exit 1
          fi

      - name: Package image with AnyKernel3
        id: package
        run: |
          BUILD_DATE="$(date)"
          TIMESTAMP="$(date +%d%m%y-%H%M%S)"
          set -euxo pipefail
          unzip "anykernel.zip" -d anykernel/
          cp out/arch/arm64/boot/Image.gz anykernel/
          touch -a -m -t 200901010000.00 "anykernel/Image.gz"
          ZIP_NAME="common-5.15.${KERNEL_VERSION}-gyabii_resukisu-$(date +%d%m%y-%H%M%S)"
          cd anykernel
          zip -r0 ../"${ZIP_NAME}".zip ./*
          cd ..
          HASH=$(sha256sum "${ZIP_NAME}.zip" | awk '{print $1}')
          cat >> "release_notes.md" << EOF
          Built at: ${BUILD_DATE}
          
          sha256:
          \`\`\`
          ${HASH}
          \`\`\`
          EOF
          echo "zip_full_path=$GITHUB_WORKSPACE/${ZIP_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "tag_name=common-resukisu-5.15.${KERNEL_VERSION}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Upload the flashable kernel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: anykernel/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "ReSukiSU 5.15.${{ env.KERNEL_VERSION }} common kernel"
          tag_name: ${{ steps.package.outputs.tag_name }}
          files: ${{ steps.package.outputs.zip_full_path }}
          body_path: release_notes.md
          make_latest: true
